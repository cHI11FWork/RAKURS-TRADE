<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 960" fill="none">
  <defs>
    <radialGradient id="glowPower" cx="50%" cy="78%" r="45%">
      <stop offset="0%" stop-color="#f5b301" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f5b301" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bgPower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141620"/>
      <stop offset="100%" stop-color="#0a0b10"/>
    </linearGradient>
  </defs>

  <rect width="800" height="960" fill="url(#bgPower)"/>
  <ellipse cx="400" cy="760" rx="360" ry="220" fill="url(#glowPower)"/>

  <!-- factory silhouette, background -->
  <g stroke="#e7e8ec" stroke-opacity="0.28" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <path d="M90 560 L90 420 L150 420 L150 460 L200 460 L200 400 L250 400 L250 460 L300 460 L300 380 L340 380 L340 560 Z"/>
    <line x1="120" y1="420" x2="120" y2="330"/>
    <line x1="220" y1="400" x2="220" y2="310"/>
    <line x1="320" y1="380" x2="320" y2="290"/>
    <rect x="105" y="470" width="30" height="34"/>
    <rect x="175" y="470" width="30" height="34"/>
    <rect x="245" y="470" width="30" height="34"/>
  </g>

  <!-- power line from factory to generator -->
  <path d="M340 480 C 420 480, 440 480, 470 480" stroke="#f5b301" stroke-opacity="0.55" stroke-width="4" stroke-dasharray="2 14" stroke-linecap="round"/>

  <!-- generator housing -->
  <g stroke="#eef0f4" stroke-opacity="0.9" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <rect x="230" y="480" width="380" height="260" rx="14"/>
    <line x1="230" y1="560" x2="610" y2="560"/>
    <line x1="420" y1="560" x2="420" y2="740"/>
    <line x1="260" y1="600" x2="260" y2="700"/>
    <line x1="290" y1="600" x2="290" y2="700"/>
    <line x1="320" y1="600" x2="320" y2="700"/>
    <line x1="350" y1="600" x2="350" y2="700"/>
    <rect x="470" y="595" width="100" height="100" rx="8"/>
  </g>

  <!-- lightning bolt on control panel, accent -->
  <path d="M535 610 L500 655 L520 655 L505 685 L548 638 L526 638 Z" fill="#f5b301" stroke="#f5b301" stroke-width="2" stroke-linejoin="round"/>

  <!-- support legs -->
  <g stroke="#eef0f4" stroke-opacity="0.7" stroke-width="6" stroke-linecap="round">
    <line x1="260" y1="740" x2="260" y2="770"/>
    <line x1="580" y1="740" x2="580" y2="770"/>
  </g>
</svg>
