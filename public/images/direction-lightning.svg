<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 960" fill="none">
  <defs>
    <radialGradient id="glowLightning" cx="58%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#f5b301" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#f5b301" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bgLightning" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161522"/>
      <stop offset="100%" stop-color="#0a0b10"/>
    </linearGradient>
  </defs>

  <rect width="800" height="960" fill="url(#bgLightning)"/>
  <ellipse cx="470" cy="290" rx="300" ry="240" fill="url(#glowLightning)"/>

  <!-- storm clouds -->
  <g stroke="#e7e8ec" stroke-opacity="0.3" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <path d="M120 200 q30 -40 70 -20 q10 -34 50 -30 q40 -6 54 24 q40 -6 46 30 q26 6 20 34 l-250 0 q-16 -26 10 -38 Z"/>
  </g>

  <!-- building with mast -->
  <g stroke="#eef0f4" stroke-opacity="0.9" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <rect x="200" y="470" width="220" height="290" rx="6"/>
    <line x1="240" y1="510" x2="240" y2="760"/>
    <line x1="280" y1="510" x2="280" y2="760"/>
    <line x1="320" y1="510" x2="320" y2="760"/>
    <line x1="360" y1="510" x2="360" y2="760"/>
    <rect x="215" y="500" width="35" height="45"/>
    <rect x="270" y="500" width="35" height="45"/>
    <rect x="325" y="500" width="35" height="45"/>
    <!-- mast -->
    <line x1="310" y1="470" x2="310" y2="330"/>
    <line x1="290" y1="345" x2="330" y2="345"/>
    <circle cx="310" cy="325" r="8"/>
  </g>

  <!-- lightning bolt striking the rod -->
  <path d="M420 120 L340 300 L390 300 L330 460 L470 260 L410 260 Z" fill="none" stroke="#f5b301" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- grounding cable -->
  <path d="M310 470 L310 620 Q310 650 340 650 L340 800" stroke="#f5b301" stroke-opacity="0.7" stroke-width="5" stroke-dasharray="3 10" stroke-linecap="round" fill="none"/>

  <!-- ground symbol -->
  <g stroke="#eef0f4" stroke-opacity="0.85" stroke-width="6" stroke-linecap="round">
    <line x1="290" y1="800" x2="390" y2="800"/>
    <line x1="305" y1="822" x2="375" y2="822"/>
    <line x1="320" y1="844" x2="360" y2="844"/>
  </g>
</svg>
